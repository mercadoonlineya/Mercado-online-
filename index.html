
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Online</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:Arial,sans-serif;background:#f3f4f6;color:#222;}
        .caja{background:white;width:90%;max-width:400px;padding:30px;border-radius:20px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.15);}
        #pantalla{min-height:100vh;display:flex;justify-content:center;align-items:center;}
        .oculto{display:none !important;}
        .logo-icon{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;background:#ffe600;border-radius:50%;font-size:28px;margin-bottom:8px;}
        .logo{font-size:30px;font-weight:bold;margin-bottom:10px;}
        button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:10px;background:#ffe600;color:#222;font-size:16px;font-weight:bold;cursor:pointer;}
        button:hover{background:#f5d900;}
        .gris{background:#555;color:white;}
        .gris:hover{background:#444;}
        .rojo{background:#dc2626;color:white;}
        .verde{background:#16a34a;color:white;}
        .verde:hover{background:#15803d;}
        .azul{background:#2563eb;color:white;}
        .azul:hover{background:#1d4ed8;}
        input,select{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;}
        .mensaje{min-height:22px;margin:10px 0;font-weight:bold;}
        .error{color:red;}
        .exito{color:green;}
        #mercado{display:none;}
        header{background:#ffe600;padding:15px;text-align:center;position:sticky;top:0;z-index:10;}
        nav{margin-top:10px;display:flex;justify-content:center;flex-wrap:wrap;gap:5px;}
        nav button{width:auto;padding:8px 12px;margin:0;}
        main{padding:20px;max-width:1200px;margin:auto;}
        .tarjeta{background:white;padding:20px;border-radius:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;}
        .producto{background:white;padding:12px;border-radius:12px;}
        .producto img{width:100%;height:180px;object-fit:cover;border-radius:8px;background:#fff;border:1px solid #eee;}
        .categoria{color:#777;font-size:13px;margin:5px 0;}
        .precio{font-size:20px;font-weight:bold;margin:8px 0;color:#166534;}
        .item{display:flex;gap:15px;padding:10px 0;border-bottom:1px solid #eee;align-items:center;}
        .item img{width:70px;height:70px;object-fit:cover;border-radius:8px;background:#fff;}
        .total{text-align:right;font-size:22px;margin-top:15px;font-weight:bold;}
        .saldo{background:#ffe600;padding:15px;border-radius:12px;text-align:center;margin:15px 0;}
        .compra-item{border-bottom:1px solid #eee;padding:12px 0;text-align:left;}
        .compra-fecha{color:#666;font-size:14px;}
        .compra-total{font-weight:bold;color:#166534;margin-top:5px;}
        .retiro-datos{text-align:left;margin:15px 0;}
        .retiro-datos label{display:block;margin:8px 0 4px;font-weight:bold;}
    </style>
</head>
<body>
<div id="pantalla">
    <div class="caja" id="inicio">
        <div class="logo-icon">🛒</div>
        <div class="logo">Mercado Online</div>
        <h2>Bienvenido</h2>
        <button id="btnIrLogin">🔐 Iniciar sesión</button>
        <button class="gris" id="btnIrRegistro">📝 Crear cuenta</button>
    </div>
    <div class="caja oculto" id="registro">
        <div class="logo-icon">🛒</div>
        <div class="logo">Mercado Online</div>
        <h2>Crear tu cuenta</h2>
        <input type="email" id="correoReg" placeholder="Tu correo electrónico">
        <input type="password" id="claveReg" placeholder="Tu contraseña (mínimo 6 caracteres)">
        <div class="mensaje" id="msgReg"></div>
        <button id="btnCrearCuenta">CREAR CUENTA</button>
        <button class="gris" id="btnVolver1">Volver</button>
    </div>
    <div class="caja oculto" id="login">
        <div class="logo-icon">🛒</div>
        <div class="logo">Mercado Online</div>
        <h2>Iniciar sesión</h2>
        <input type="email" id="correoLog" placeholder="Tu correo electrónico">
        <input type="password" id="claveLog" placeholder="Tu contraseña">
        <div class="mensaje" id="msgLog"></div>
        <button id="btnEntrar">ENTRAR</button>
        <button class="gris" id="btnVolver2">Volver</button>
    </div>
</div>
<div id="mercado">
    <header>
        <h2>🛒 Mercado Online</h2>
        <nav id="menuNavegacion"></nav>
    </header>
    <main id="contenido"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDg28HZsxITC35b1u5fNorcm3Lx47EyIyQ",
    authDomain: "mercado-433d9.firebaseapp.com",
    databaseURL: "https://mercado-433d9-default-rtdb.firebaseio.com",
    projectId: "mercado-433d9",
    storageBucket: "mercado-433d9.firebasestorage.app",
    messagingSenderId: "626975011705",
    appId: "1:626975011705:web:4862a4bf7547e920c475a8"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const CORREO_ADMIN = "fuelpazvictor774@gmail.com;
let usuarioActivo = null;
let carrito = [];

// ✅ CONEXIÓN DIRECTA DE TODOS LOS BOTONES AL CARGAR LA PÁGINA
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btnIrLogin').addEventListener('click', ()=>mostrar('login'));
    document.getElementById('btnIrRegistro').addEventListener('click', ()=>mostrar('registro'));
    document.getElementById('btnVolver1').addEventListener('click', ()=>mostrar('inicio'));
    document.getElementById('btnVolver2').addEventListener('click', ()=>mostrar('inicio'));
    document.getElementById('btnCrearCuenta').addEventListener('click', registrar);
    document.getElementById('btnEntrar').addEventListener('click', entrar);
});

function mostrar(que){
    document.querySelectorAll('.caja').forEach(c => c.classList.add('oculto'));
    document.getElementById(que).classList.remove('oculto');
}

async function darUsuario(){
    const user = auth.currentUser;
    if(!user) return null;
    const snap = await db.ref("usuarios/" + user.uid).once('value');
    return snap.exists() ? {uid:user.uid, ...snap.val()} : null;
}

async function guardarCambios(usuario){
    if(!auth.currentUser) return;
    await db.ref("usuarios/" + auth.currentUser.uid).set(usuario);
    usuarioActivo = usuario;
}

async function registrar(){
    const correo = document.getElementById('correoReg').value.trim().toLowerCase();
    const clave = document.getElementById('claveReg').value;
    const msg = document.getElementById('msgReg');
    msg.textContent = ''; msg.className = 'mensaje';

    if(!correo || !clave){ msg.textContent='Completa todos los campos'; msg.className='mensaje error'; return; }
    if(clave.length < 6){ msg.textContent='Mínimo 6 caracteres'; msg.className='mensaje error'; return; }
    if(correo === CORREO_ADMIN){ msg.textContent='Correo reservado al administrador'; msg.className='mensaje error'; return; }

    try{
        const res = await auth.createUserWithEmailAndPassword(correo, clave);
        await db.ref("usuarios/" + res.user.uid).set({correo, saldo:0, retiros:[], historialCompras:[], esAdmin:false});
        await auth.signOut();
        msg.textContent='✅ Cuenta creada correctamente'; msg.className='mensaje exito';
        setTimeout(()=>mostrar('login'), 1200);
    }catch(e){
        msg.textContent = '❌ ' + (e.code==='auth/email-already-in-use' ? 'Ya existe esta cuenta' : 'Error al crear');
        msg.className='mensaje error';
    }
}

async function entrar(){
    const correo = document.getElementById('correoLog').value.trim().toLowerCase();
    const clave = document.getElementById('claveLog').value;
    const msg = document.getElementById('msgLog');
    msg.textContent = ''; msg.className = 'mensaje';

    if(!correo || !clave){ msg.textContent='Completa todos los campos'; msg.className='mensaje error'; return; }

    try{
        await auth.signInWithEmailAndPassword(correo, clave);
    }catch(e){
        msg.textContent='❌ Datos incorrectos'; msg.className='mensaje error';
    }
}

auth.onAuthStateChanged(async user => {
    if(!user){
        document.getElementById('mercado').style.display='none';
        document.getElementById('pantalla').classList.remove('oculto');
        return;
    }
    let usu = await darUsuario();
    if(!usu && user.email === CORREO_ADMIN){
        await db.ref("usuarios/" + user.uid).set({correo:CORREO_ADMIN, saldo:0, retiros:[], historialCompras:[], esAdmin:true});
        usu = await darUsuario();
    }
    if(!usu){ await auth.signOut(); return alert('Perfil no encontrado'); }

    usuarioActivo = usu;
    document.getElementById('pantalla').classList.add('oculto');
    document.getElementById('mercado').style.display='block';
    cargarMenu(); iniMercado();
});

async function cargarMenu(){
    const usu = await darUsuario();
    document.getElementById('menuNavegacion').innerHTML = usu.esAdmin ? `
        <button onclick="iniMercado()">🏠 Inicio</button>
        <button onclick="verProds()">📦 Productos</button>
        <button onclick="verCarrito()">🛒 Carrito</button>
        <button onclick="verRetiros()">💵 Retiros</button>
        <button onclick="verHistorial()">🧾 Mis Compras</button>
        <button class="azul" onclick="panelAdmin()">⚙️ ADMIN</button>
        <button onclick="verCuenta()">👤 Cuenta</button>
        <button onclick="salir()">🚪 Salir</button>
    ` : `
        <button onclick="iniMercado()">🏠 Inicio</button>
        <button onclick="verProds()">📦 Productos</button>
        <button onclick="verCarrito()">🛒 Carrito</button>
        <button onclick="verRetiros()">💵 Retiros</button>
        <button onclick="verHistorial()">🧾 Mis Compras</button>
        <button onclick="verCuenta()">👤 Cuenta</button>
        <button onclick="salir()">🚪 Salir</button>
    `;
}

async function panelAdmin(){
    document.getElementById('contenido').innerHTML = `
    <div class="tarjeta"><h2>⚙️ Panel del Creador</h2>
    <input type="email" id="buscarCorreo" placeholder="Correo del usuario">
    <button class="azul" onclick="buscarUsuario()">🔍 Buscar</button>
    <div id="resultadoBusqueda"></div></div>`;
}

async function buscarUsuario(){
    const correo = document.getElementById('buscarCorreo').value.trim().toLowerCase();
    const snap = await db.ref("usuarios").once('value');
    if(!snap.exists()) return document.getElementById('resultadoBusqueda').innerHTML='<p style="color:red;">❌ No hay cuentas</p>';
    
    const usuarios = snap.val();
    let enc = null, uidEnc = null;
    Object.entries(usuarios).forEach(([uid,u])=>{
        if(u.correo?.toLowerCase()===correo && !u.esAdmin){ enc=u; uidEnc=uid; }
    });

    if(!enc) return document.getElementById('resultadoBusqueda').innerHTML='<p style="color:red;">❌ No encontrado</p>';
    document.getElementById('resultadoBusqueda').innerHTML = `
    <hr><p>Correo: ${enc.correo}</p><p>Saldo: $${Number(enc.saldo).toLocaleString("es-CO")}</p>
    <input type="number" id="val" placeholder="Agregar saldo">
    <button class="verde" onclick="agregarSaldo('${uidEnc}')">✅ Aplicar</button>`;
}

async function agregarSaldo(uid){
    const val = Number(document.getElementById('val').value);
    const usu = await db.ref("usuarios/"+uid).once('value');
    await db.ref("usuarios/"+uid).update({saldo: Number(usu.val().saldo)+val});
    alert('✅ Saldo actualizado'); panelAdmin();
}

async function iniMercado(){
    const usu = await darUsuario();
    document.getElementById('contenido').innerHTML = `
    <div class="tarjeta" style="text-align:center;padding:40px 20px;">
        <div class="logo-icon">🛒</div><h2>¡Bienvenido!</h2>
        <p>Correo: <strong>${usu.correo}</strong></p>
        <p>Saldo: <strong>$${Number(usu.saldo).toLocaleString("es-CO")}</strong></p>
        <button onclick="verProds()">🛍️ Ir a comprar</button>
    </div>`;
}

const productos = [
    {id:1, nombre:"Borrador", categoria:"Papelería", precio:7000, imagen:"https://images.unsplash.com/photo-1581291518857-4e27b48ff24e?w=400&h=300&fit=crop"},
    {id:2, nombre:"Lápiz", categoria:"Papelería", precio:12000, imagen:"https://images.unsplash.com/photo-1585336261022-680e295ce3fe?w=400&h=300&fit=crop"},
    {id:3, nombre:"Chocolate cacao", categoria:"Alimentos", precio:50000, imagen:"https://images.unsplash.com/photo-1606312619070-d48b4c652a52?w=400&h=300&fit=crop"},
    {id:4, nombre:"Agua mineral", categoria:"Bebidas", precio:31000, imagen:"https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=400&h=300&fit=crop"},
    {id:5, nombre:"Cuaderno", categoria:"Papelería", precio:20000, imagen:"https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=400&h=300&fit=crop"},
    {id:6, nombre:"Gorra", categoria:"Ropa", precio:19900, imagen:"https://images.unsplash.com/photo-1575086888743-3c4a915a8220?w=400&h=300&fit=crop"},
    {id:7, nombre:"Gafas", categoria:"Accesorios", precio:5000, imagen:"https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&h=300&fit=crop"},
    {id:8, nombre:"Zapatos Deportivos", categoria:"Calzado", precio:70000, imagen:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=300&fit=crop"},
    {id:9, nombre:"Audífonos", categoria:"Tecnología", precio:29900, imagen:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=300&fit=crop"},
    {id:10, nombre:"Mochila", categoria:"Accesorios", precio:45000, imagen:"https://images.unsplash.com/photo-1553062407-98eeb64c6a52?w=400&h=300&fit=crop"},
    {id:11, nombre:"Reloj", categoria:"Tecnología", precio:249900, imagen:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=300&fit=crop"},
    {id:12, nombre:"Celular", categoria:"Tecnología", precio:1299900, imagen:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&h=300&fit=crop"}
];

function verProds(){
    let html = `<div class="tarjeta"><h2>📦 Productos</h2></div><div class="grid">`;
    productos.forEach(p=>{ html += `<div class="producto"><img src="${p.imagen}" alt="${p.nombre}" loading="lazy"><div class="categoria">${p.categoria}</div><h4>${p.nombre}</h4><div class="precio">$${p.precio.toLocaleString("es-CO")}</div><button onclick="carrito.push(productos.find(x=>x.id===${p.id}));alert('✅ Agregado')">🛒 Agregar</button></div>`; });
    html += `</div>`; document.getElementById('contenido').innerHTML = html;
}

async function verCarrito(){
    const usu = await darUsuario();
    if(!carrito.length) return document.getElementById('contenido').innerHTML=`<div class="tarjeta" style="text-align:center;"><h3>🛒 Carrito vacío</h3><button onclick="verProds()">Ver productos</button></div>`;
    const total = carrito.reduce((s,x)=>s+x.precio,0);
    let html = `<div class="tarjeta"><h2>🛒 Tu carrito</h2>`;
    carrito.forEach((x,i)=>html += `<div class="item"><img src="${x.imagen}"><div><strong>${x.nombre}</strong><p>$${x.precio.toLocaleString("es-CO")}</p><button class="rojo" style="width:auto;padding:8px;" onclick="carrito.splice(${i},1);verCarrito()">Quitar</button></div></div>`);
    html += `<div class="total">Total: $${total.toLocaleString("es-CO")}</div><p>Tu saldo: $${Number(usu.saldo).toLocaleString("es-CO")}</p><button onclick="pagar()">💳 CONFIRMAR PAGO</button></div>`;
    document.getElementById('contenido').innerHTML = html;
}

async function pagar(){
    const usu = await darUsuario();
    const total = carrito.reduce((s,x)=>s+x.precio,0);
    if(total > Number(usu.saldo)) return alert(`❌ Saldo insuficiente\nTienes: $${Number(usu.saldo).toLocaleString("es-CO")}`);
    usu.historialCompras.unshift({fecha:new Date().toLocaleString("es-CO"), productos:[...carrito], total});
    usu.saldo -= total;
    await guardarCambios(usu);
    carrito = []; alert('✅ ¡COMPRA REALIZADA! 🎉'); iniMercado();
}

async function verHistorial(){
    const usu = await darUsuario();
    if(!usu.historialCompras?.length) return document.getElementById('contenido').innerHTML=`<div class="tarjeta" style="text-align:center;"><h3>🧾 No tienes compras</h3><button onclick="verProds()">Ir a comprar</button></div>`;
    let html = `<div class="tarjeta"><h2>🧾 Historial</h2>`;
    usu.historialCompras.forEach(c=>{ html += `<div class="compra-item"><div class="compra-fecha">📅 ${c.fecha}</div>`; c.productos.forEach(p=>html+=`<div style="padding-left:10px;">• ${p.nombre} - $${p.precio.toLocaleString("es-CO")}</div>`); html += `<div class="compra-total">Total: $${c.total.toLocaleString("es-CO")}</div></div>`; });
    document.getElementById('contenido').innerHTML = html;
}

async function verRetiros(){
    const usu = await darUsuario();
    document.getElementById('contenido').innerHTML = `
    <div class="tarjeta"><h2>💵 Retiros</h2><div class="saldo"><p>Saldo disponible</p><h2>$${Number(usu.saldo).toLocaleString("es-CO")}</h2></div>
    <p>Mínimo $2.000 COP</p><div class="retiro-datos"><label>Monto:</label><input type="number" id="montoR" min="2000" placeholder="Valor">
    <label>Banco:</label><select id="bancoR"><option value="">Selecciona</option><option>Bancolombia</option><option>Davivienda</option><option>Nequi</option></select>
    <label>Cuenta/Celular:</label><input type="text" id="cuentaR"></div>
    <button class="verde" onclick="hacerRetiro()">✅ Solicitar</button></div>`;
}

async function hacerRetiro(){
    const usu = await darUsuario();
    const monto = Number(document.getElementById('montoR').value);
    if(!monto || monto<2000 || monto>usu.saldo) return alert('Datos incorrectos');
    usu.saldo -= monto;
    usu.retiros = usu.retiros || [];
    usu.retiros.unshift({valor:monto, fecha:new Date().toLocaleString("es-CO")});
    await guardarCambios(usu); alert(`✅ Retiro: $${monto.toLocaleString("es-CO")}`); iniMercado();
}

async function verCuenta(){
    const usu = await darUsuario();
    document.getElementById('contenido').innerHTML = `<div class="tarjeta" style="text-align:center;"><h3>👤 Tu Cuenta</h3><p>Correo: ${usu.correo}</p></div><div class="saldo"><p>Saldo</p><h2>$${Number(usu.saldo).toLocaleString("es-CO")}</h2></div><div class="tarjeta"><button class="gris" onclick="salir()">🚪 Cerrar sesión</button></div>`;
}

async function salir(){
    carrito = []; await auth.signOut();
    document.getElementById('mercado').style.display='none';
    document.getElementById('pantalla').classList.remove('oculto');
    mostrar('inicio');
}
</script>
</body>
</html>
